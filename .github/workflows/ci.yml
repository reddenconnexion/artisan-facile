name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Le dépôt porte encore une dette de lint : on bloque seulement les PR qui
      # AJOUTENT des erreurs dans les fichiers qu'elles modifient (comparaison
      # avec la base, même config). Une PR de nettoyage qui touche un fichier
      # encore endetté n'est pas obligée de tout corriger.
      - name: Lint des fichiers modifiés (bloquant sur toute nouvelle erreur)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR "origin/${BASE_REF}...HEAD" -- '*.js' '*.jsx' '*.mjs')
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun fichier JS/JSX modifié."
            exit 0
          fi
          git worktree add --detach "$RUNNER_TEMP/base" "$(git merge-base "origin/${BASE_REF}" HEAD)"
          node .github/scripts/lint-ratchet.mjs "$RUNNER_TEMP/base" "${files[@]}"

      - name: Lint complet (informatif)
        continue-on-error: true
        run: npx eslint .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
